name: Delivery contract
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: delivery-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  producer-consumer:
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'github-actions[bot]'
    name: PixivFlow delivery contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          path: consumer
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: redtidev1918/PixivFlow
          ref: master
          path: producer
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: producer/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips42
      - run: python -m pip install -r consumer/requirements-dev.txt
      - run: npm ci && npm run build
        working-directory: producer
      - name: Record the tested pair
        run: |
          git -C producer rev-parse HEAD
          git -C consumer rev-parse HEAD
      - name: Exercise the real producer and consumer
        run: python producer/scripts/verify-telepost-contract.py consumer
