name: PyPI Publish

# Publish telepost-bot to PyPI as part of the release pipeline.
#
# TRIGGER NOTE (this repo's convention — see update-download-page.yml):
# release-please runs with skip-github-release=true, so there is no
# ``release: published`` event, and tags created by a workflow using the default
# GITHUB_TOKEN do NOT fan out ``push: tags:`` runs. That is why this workflow has
# never fired from a tag push before. The reliable entry point is the
# ReleaseGraph post-release action declared in .release-policy.yml, which
# dispatches this workflow with an exact ``tag`` input.
#
# Trigger priority:
#   1. workflow_call / workflow_dispatch with ``tag`` — ReleaseGraph post-release
#      entry point (the one that actually runs today).
#   2. push tags: v* — fallback for tags pushed by a human or a PAT.
# Both produce identical artifacts; only the way the tag is discovered differs.
#
# Version source of truth:
# release-please bumps telepost/build_info.py (see release-please-config.json
# extra-files). Nothing here creates a second version bump.
#
# Authentication: OIDC Trusted Publishing. No API token is stored.
#
# One-time manual setup (pending publisher, cannot be automated from here):
#   1. https://pypi.org/manage/account/publishing/ -> "Add a new pending publisher"
#      PyPI Project Name:  telepost-bot
#      Owner:              redtidev1918
#      Repository name:    TelePost
#      Workflow name:      pypi-publish.yml   (filename only, no path)
#      Environment name:   pypi
#   2. TestPyPI: repeat at https://test.pypi.org/manage/account/publishing/
# Until a publisher exists, the publish job fails with an OIDC error. This
# workflow reports NO successful PyPI release in that case.

on:
  workflow_call:
    inputs:
      tag:
        description: 'Exact tag to publish, e.g. v2.78.0'
        type: string
        required: false
      testpypi:
        description: 'Publish to TestPyPI instead of PyPI'
        type: boolean
        required: false
        default: false
      dry_run:
        description: 'Build and validate without publishing'
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: 'Exact tag to publish, e.g. v2.78.0'
        type: string
        required: false
      testpypi:
        description: 'Publish to TestPyPI instead of PyPI'
        type: boolean
        required: false
        default: false
      dry_run:
        description: 'Build and validate without publishing'
        type: boolean
        required: false
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write  # Required for OIDC Trusted Publishing

concurrency:
  group: pypi-publish-${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Resolve target tag
        id: resolve
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: ${TAG:-<from checkout>}"

      - uses: actions/checkout@v7
        with:
          # Post-release runs execute on the default branch, so pin the tree to
          # the tag we were told to publish. Falls back to the current ref.
          ref: ${{ steps.resolve.outputs.tag || github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install libvips (pyvips runtime dependency)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips42

      - name: Install Python build tools
        run: pip install build twine

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Build Mini App frontend
        working-directory: webapp
        run: |
          npm ci || npm install
          npm run generate:api && npm run build

      - name: "Read package version (single source - telepost/build_info.py)"
        id: version
        run: |
          PY_VERSION="$(python -c 'from telepost.build_info import RELEASE_VERSION; print(RELEASE_VERSION)')"
          echo "value=${PY_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Code version: ${PY_VERSION}"

      - name: Verify tag matches code version
        if: ${{ steps.resolve.outputs.tag != '' }}
        env:
          TAGGED: ${{ steps.resolve.outputs.tag }}
          PY_VERSION: ${{ steps.version.outputs.value }}
        run: |
          TAG_VERSION="${TAGGED#v}"
          echo "Tag version:  $TAG_VERSION"
          echo "Code version: $PY_VERSION"
          if [ "$TAG_VERSION" != "$PY_VERSION" ]; then
            echo "::error::Version mismatch: tag=$TAG_VERSION code=$PY_VERSION"
            exit 1
          fi

      - name: Build wheel and sdist
        run: python -m build

      - name: Require artifacts for this version
        env:
          PY_VERSION: ${{ steps.version.outputs.value }}
        run: |
          ls -lh dist/
          ls "dist/telepost_bot-${PY_VERSION}-py3-none-any.whl" \
             "dist/telepost_bot-${PY_VERSION}.tar.gz"

      - name: Validate artifacts
        run: twine check dist/*

      - name: Verify artifacts contain Mini App assets
        run: |
          echo "=== Wheel: webapp/dist ==="
          python -c "
          import zipfile, sys
          with zipfile.ZipFile(sys.argv[1]) as z:
            print('\n'.join(n for n in z.namelist() if 'webapp/dist' in n))
          " dist/*.whl
          echo "=== Sdist: webapp/dist ==="
          tar tzf dist/*.tar.gz | grep 'webapp/dist'
          echo "=== Wheel: review_policy.md ==="
          python -c "
          import zipfile, sys
          with zipfile.ZipFile(sys.argv[1]) as z:
            print('\n'.join(n for n in z.namelist() if 'review_policy' in n))
          " dist/*.whl

      - name: Smoke test the built wheel
        env:
          TOKEN: 123456:ci-smoke-test
          CHANNEL_ID: '@ci-smoke-channel'
          OWNER_ID: '1'
          REVIEW_CHAT_ID: '-1009999999'
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install --upgrade pip
          /tmp/wheel-check/bin/pip install dist/*.whl
          /tmp/wheel-check/bin/telepost --version
          /tmp/wheel-check/bin/python -c "
          import telepost
          assert 'site-packages' in telepost.__file__, telepost.__file__
          print('telepost imported from', telepost.__file__)
          "
          # The Mini App must survive packaging (hard gate).
          /tmp/wheel-check/bin/python - <<'PY'
          import asyncio
          import aiohttp
          from utils.webhook_server import WebhookServer

          async def main():
              server = WebhookServer(None, 8099, "/webhook0", "ci-secret")
              await server.start()
              try:
                  async with aiohttp.ClientSession() as s:
                      async with s.get("http://127.0.0.1:8099/app/") as r:
                          body = await r.text()
                          assert r.status == 200, r.status
                          assert "<html" in body.lower(), body[:200]
                          print("Mini App /app/ served OK")
              finally:
                  await server.stop()

          asyncio.run(main())
          PY

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi  # Must match the PyPI Trusted Publisher config
    if: ${{ !inputs.dry_run }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        if: ${{ inputs.testpypi }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # A version may legitimately already exist when a release is retried
          # (ReleaseGraph repair/force). Never fight over an already-published
          # version - that is what "do not upload the same version twice" means.
          skip-existing: true

      - name: Publish to PyPI
        if: ${{ !inputs.testpypi }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
