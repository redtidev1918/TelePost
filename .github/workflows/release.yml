name: Release

# 打 tag（v*）触发：构建多架构镜像推送 GHCR，并创建带 CHANGELOG 摘录的 GitHub Release
# 发版操作步骤见 docs/OPERATIONS.md 「发布流程」
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # 创建 GitHub Release
  packages: write   # 推送 GHCR 镜像

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装测试依赖
        run: pip install -r requirements-dev.txt
      - name: 校验 tag 与代码版本一致
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CODE_VERSION=$(python -c "import re; print(re.search(r'\"VERSION\": \"([^\"]+)\"', open('utils/helper_functions.py', encoding='utf-8').read()).group(1))")
          test "$TAG_VERSION" = "$CODE_VERSION"
      - name: 运行完整测试
        run: python -m pytest -q --no-cov -o log_cli=false

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # GHCR 镜像名必须全小写，而 github.repository 保留原大小写
      - name: 计算小写镜像名
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: 设置 QEMU（arm64 构建）
        uses: docker/setup-qemu-action@v4

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签与元数据
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=TelePost
            org.opencontainers.image.description=Telegram 频道投稿机器人
            org.opencontainers.image.licenses=MIT

      - name: 构建并推送镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bundle:
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: telepost-linux-x64
          - os: windows-latest
            asset: telepost-windows-x64.exe
          - os: macos-latest
            asset: telepost-macos-arm64
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装依赖与 PyInstaller
        run: pip install -r requirements.txt pyinstaller
      - name: 构建单文件可执行（含解释器，用户零依赖）
        run: pyinstaller --onefile --clean --name telepost run.py
      - name: 以平台名命名产物（避免不同平台同名互相覆盖）
        run: python -c "from pathlib import Path; next(Path('dist').glob('telepost*')).rename(Path('dist') / '${{ matrix.asset }}')"
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [test, docker, bundle]
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 从 CHANGELOG 提取发布说明
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          python3 - "$TAG_VERSION" > release_notes.md <<'PY'
          import re, sys

          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          sections = re.split(r"(?m)^## ", text)[1:]

          body = None
          # 优先取与 tag 对应的版本段（兼容 [2.2.0] / [v2.2.0] 两种写法）
          for section in sections:
              if re.match(r"\[?v?" + re.escape(version) + r"\]", section):
                  body = section.split("\n", 1)[1].strip() if "\n" in section else ""
                  break
          # 版本段缺失时回退到 [Unreleased]（发版前应把 Unreleased 并入版本段）
          if body is None:
              for section in sections:
                  if section.startswith("[Unreleased]"):
                      body = section.split("\n", 1)[1].strip() if "\n" in section else ""
                      break
          if not body:
              body = "TelePost " + version

          install_lines = [
              "## 安装", "",
              "```bash",
              "docker run -d --name telepost \\",
              "  -e TOKEN=你的TOKEN -e CHANNEL_ID=@你的频道 -e OWNER_ID=你的ID \\",
              "  ghcr.io/redtidev1918/telepost:latest",
              "```", "",
              "更多方式见 [docs/INSTALL.md](https://github.com/redtidev1918/TelePost/blob/main/docs/INSTALL.md)。",
          ]
          print("\n".join(body.split("\n") + [""] + install_lines))
          PY
          echo "---- 发布说明预览 ----"
          cat release_notes.md

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "TelePost $GITHUB_REF_NAME" \
            --notes-file release_notes.md \
            --verify-tag \
            --latest

      - name: 下载分平台可执行产物
        uses: actions/download-artifact@v5
        with:
          pattern: telepost-*
          path: bundles
          merge-multiple: false

      - name: 附加到 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ls bundles/*/telepost* >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" bundles/*/telepost* \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "没有可执行产物（如手动触发），跳过附加。"
          fi

      - name: 清理旧 release（每个 track 只留最新）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/prune_releases.py
