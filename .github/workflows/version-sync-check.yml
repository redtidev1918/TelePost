name: Version sync check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  telepress:
    # Skip release-please PRs (authored by github-actions[bot]): GitHub holds their
    # workflow runs for approval so they never start, which shows a permanent failed
    # check on every release PR. Self-healing: once RELEASE_PLEASE_TOKEN (a real user
    # PAT) authors the release PR, this guard no longer matches and CI returns.
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check telepress pin matches TelePress service
        run: python3 scripts/verify_telepress_version_sync.py

  preview-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        telepress: ['0.17.2', '0.18.0']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: pip install --no-deps telepress==${{ matrix.telepress }}
      - name: Exercise installed TelePress API and preview compensation
        run: python -m pytest -q --no-cov tests/test_telepress_contract.py tests/test_preview_recovery.py
