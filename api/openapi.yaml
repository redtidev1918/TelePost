openapi: 3.1.0
info:
  title: TelePost HTTP API
  version: "1.0"
  description: |
    Canonical HTTP contract for TelePost. All endpoints are under `/api/v1`
    and require a bearer API token.

    Business acknowledgement (`business_status`) on submission responses:

    * `accepted` — the work was published (or accepted into review);
    * `idempotent_replay` — the same `idempotency_key` already completed;
    * `duplicate_existing` — another key already published the same work;
    * `retryable_failure` — transport/timeout; Telegram state is unknown,
      the server never auto-resends; reconcile with `GET /deliveries/lookup`;
    * `permanent_failure` — deterministic rejection; do not resend unchanged.

    Identity and provenance (§identity) — three orthogonal concepts:

    * `actor` — WHO/WHAT executed the request (`user` for Telegram/Mini App
      sessions, `service` for API tokens / automatic delivery, `unknown` for
      undecidable legacy rows). Stored as `actor_kind`/`actor_subject`.
    * `submitter` — the VERIFIED human owner of a review
      (`pending_reviews.submitter_user_id`). NULL for service/automatic
      submissions; the API-token owner is NEVER a submitter.
    * `source` — transport/provenance (`chat` | `api` | ...).

    A service/API submission is not proof of human ownership: `POST
    /submissions` derives ownership from the principal kind, never from the
    request body, and `GET /me/submissions` returns rows only when
    `submitter_user_id` matches the current Telegram user.

    Human submission acceptance and submitter publication notification are
    separate durable events. Manager acceptance alerts are emitted once per
    logical human submission; submitter notifications are emitted only after
    confirmed publication success. Refetch generations and editorial revisions
    never create a second manager-new-submission event.
servers:
  - url: /api/v1
security:
  - bearerToken: []
components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
  schemas:
    ErrorResponse:
      type: object
      required: [ok, error]
      properties:
        ok: {type: boolean, const: false}
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
    BusinessFailure:
      type: object
      required: [ok, data]
      properties:
        ok: {type: boolean, const: false}
        data:
          type: object
          required: [business_status, reason]
          properties:
            business_status:
              type: string
              enum: [retryable_failure, permanent_failure]
            reason: {type: string}
    SubmissionResult:
      type: object
      required: [business_status]
      properties:
        business_status:
          type: string
          enum:
            - accepted
            - idempotent_replay
            - duplicate_existing
        status:
          type: string
          enum: [published, pending_review]
        message_id: {type: [integer, 'null']}
        link: {type: string}
        media_count: {type: integer}
        document_count: {type: integer}
        delivery_status: {type: string}
        reused: {type: boolean}
        reuse_reason:
          type: string
          enum: [idempotent_replay, duplicate_existing]
        matched_idempotency_key: {type: string}
        review_id: {type: integer}
    FileIdMedia:
      type: object
      required: [type, file_id]
      properties:
        type:
          type: string
          enum: [photo, video, animation, audio]
        file_id: {type: string, maxLength: 256}
        thumbnail_file_id: {type: string, maxLength: 256}
    FileIdDocument:
      type: object
      required: [file_id]
      properties:
        file_id: {type: string, maxLength: 256}
        filename: {type: string, maxLength: 255}
    SubmissionJson:
      type: object
      required: [tags]
      properties:
        media:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/FileIdMedia'}
        documents:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/FileIdDocument'}
        tags: {type: string, maxLength: 2000}
        title: {type: string, maxLength: 255}
        note: {type: string, maxLength: 4000}
        link: {type: string, maxLength: 2048}
        anonymous: {type: boolean}
        spoiler: {type: boolean}
        idempotency_key:
          type: string
          maxLength: 240
          description: Caller-generated dedupe key; replays return the first result.
        target_id: {type: string, maxLength: 120}
        work_type:
          type: string
          enum: [illustration, novel, ""]
        pixiv_id: {type: string, maxLength: 32}
        source_label: {type: string, maxLength: 120}
        source_ref: {type: string, maxLength: 255}
        scheduled_at: {type: string, maxLength: 64}
        refetch_request_id:
          type: string
          format: uuid
          description: Canonical UUID of an admitted refetch attempt. Unresolved templates are rejected.
    NotificationRequest:
      type: object
      required: [text]
      properties:
        text: {type: string, maxLength: 2000}
        idempotency_key: {type: string, maxLength: 240}
    DeliveryLookup:
      type: object
      properties:
        source:
          type: string
          enum: [review, direct_publish, none]
        message_id: {type: [integer, 'null']}
        idempotency_key: {type: [string, 'null']}
        decided_at: {type: [number, 'null']}
        created_at: {type: [number, 'null']}
  responses:
    unauthorized:
      description: Missing, invalid or revoked token
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    reviewState:
      description: Review is not in the expected state (busy / already resolved)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    reviewNotFound:
      description: Review does not exist
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
paths:
  /health:
    get:
      security: []
      summary: Liveness/version probe
      responses:
        '200':
          description: Service metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  data:
                    type: object
                    properties:
                      service: {type: string}
                      api_version: {type: string}
                      bot_version: {type: string}
                      api_review_required: {type: boolean}
                      chat_review_required: {type: boolean}
  /me:
    get:
      summary: Token identity and current rate-limit usage
      responses:
        '200':
          description: Token identity
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  data:
                    type: object
                    properties:
                      telegram_user_id: {type: integer}
                      name: {type: string}
                      username: {type: string}
                      display_name: {type: string}
                      submissions_last_hour: {type: integer}
                      rate_limit_per_hour: {type: integer}
        '401': {$ref: '#/components/responses/unauthorized'}
  /submissions:
    post:
      summary: Submit media (file_id JSON or multipart files) for publish or review
      description: |
        `application/json` sends Telegram file_ids (zero re-upload).
        `multipart/form-data` uploads files; repeat a `files` part per file,
        up to 100 files and 500 MiB aggregate.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SubmissionJson'}
          multipart/form-data:
            schema:
              type: object
              required: [files, tags]
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                tags: {type: string}
                title: {type: string}
                note: {type: string}
                link: {type: string}
                anonymous: {type: string, enum: ['true', 'false']}
                spoiler: {type: string, enum: ['true', 'false']}
                idempotency_key: {type: string}
                target_id: {type: string}
                work_type: {type: string}
                pixiv_id: {type: string}
                refetch_request_id: {type: string, format: uuid}
      responses:
        '201':
          description: Published or queued for review
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  data: {$ref: '#/components/schemas/SubmissionResult'}
        '200':
          description: Idempotent replay or duplicate of an existing publication
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  data: {$ref: '#/components/schemas/SubmissionResult'}
        '400':
          description: Validation or permanent delivery failure
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/ErrorResponse'}
                  - {$ref: '#/components/schemas/BusinessFailure'}
        '401': {$ref: '#/components/responses/unauthorized'}
        '413':
          description: File or request too large
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '429':
          description: Rate limited
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: Retryable transport failure; reconcile via /deliveries/lookup
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BusinessFailure'}
  /deliveries/lookup:
    get:
      summary: Reconcile whether a work was already published
      parameters:
        - {in: query, name: target, required: false, schema: {type: string}}
        - {in: query, name: work_type, required: true,
           schema: {type: string, enum: [illustration, novel]}}
        - {in: query, name: pixiv_id, required: true, schema: {type: string}}
      responses:
        '200':
          description: Reconciliation result across review queue and direct ledger
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  data: {$ref: '#/components/schemas/DeliveryLookup'}
        '400':
          description: Missing work_type/pixiv_id
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401': {$ref: '#/components/responses/unauthorized'}
  /reviews:
    get:
      summary: List pending reviews
      operationId: listPendingReviews
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        '200': {description: Pending review summaries}
        '401': {description: Invalid token}
  /reviews/policy:
    get:
      summary: Read administrator-configured review policy
      operationId: getReviewPolicy
      responses:
        '200': {description: Markdown policy}
        '401': {description: Invalid token}
  /reviews/{review_id}:
    get:
      summary: Get one review
      operationId: getReview
      description: |
        Reviewer RBAC, or owner-scope read: the verified human submitter
        (submitter_user_id) of the review may read their own review and media
        read-only (§identity). Service principals never qualify.
      parameters:
        - {name: review_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: Review metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: integer}
                  status: {type: string}
                  title: {type: string}
                  submitter_user_id: {type: [integer, 'null'], description: Verified human owner; NULL for service/automatic submissions}
                  source: {type: string}
                  target_id: {type: string}
                  created_at: {type: string}
        '404': {$ref: '#/components/responses/reviewNotFound'}
  /reviews/{review_id}/media/{index}:
    get:
      summary: Get bounded image preview for review media
      operationId: getReviewMedia
      parameters:
        - {name: review_id, in: path, required: true, schema: {type: integer}}
        - {name: index, in: path, required: true, schema: {type: integer, minimum: 0}}
        - {name: variant, in: query, schema: {type: string, enum: [thumbnail, preview, original], default: preview}}
      responses:
        '200':
          description: Image bytes
          content:
            image/jpeg:
              schema: {type: string, format: binary}
        '404': {$ref: '#/components/responses/reviewNotFound'}
        '409': {$ref: '#/components/responses/reviewState'}
  /reviews/{review_id}/publish:
    post:
      summary: Publish the review — original, or a FINALIZED editorial revision
      operationId: publishReview
      description: |
        body {revision_id?}: null → publish the ORIGINAL submission; an id →
        publish the finalized editorial revision (edited snapshot). The same
        review FSM + idempotency ledger serves both; the source revision is
        recorded on the review row (published_source_revision_id, NULL =
        original). A revision whose review generation is no longer current is
        rejected (409 editorial_stale). Submit-succeeded notifications follow
        publication success (never review approval).
      parameters:
        - {name: review_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                revision_id: {type: integer}
                spoiler: {type: boolean}
      responses:
        '200': {description: ReviewActionResult}
        '409': {description: editorial_stale | editorial_state | review_busy}
        '404': {description: review_not_found}

  /reviews/{review_id}/editorial-revisions:
    get:
      summary: List editorial revisions (reviewer/admin)
      operationId: listEditorialRevisions
      parameters:
        - {name: review_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {description: "{revisions: EditorialRevision[]}"}
    post:
      summary: Create the next revision draft
      operationId: createEditorialRevision
      parameters:
        - {name: review_id, in: path, required: true, schema: {type: integer}}
      responses:
        '201': {description: EditorialRevision}
        '409': {description: review no longer current/pending}
  /reviews/{review_id}/editorial-revisions/{revision_id}:
    get:
      summary: Get one revision
      operationId: getEditorialRevision
      parameters:
        - {name: review_id, in: path, required: true, schema: {type: integer}}
        - {name: revision_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {description: EditorialRevision}
    patch:
      summary: Update a DRAFT revision (CAS expected_version → 409 on conflict)
      operationId: updateEditorialRevision
      parameters:
        - {name: review_id, in: path, required: true, schema: {type: integer}}
        - {name: revision_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version]
              description: >-
                Partial update: only the fields present are changed, and omitted
                fields keep the draft's CURRENT value (a fresh draft starts as a
                copy of the submission). Send an explicit empty value to revert a
                field. expected_version is the CAS token; a stale save returns
                409 editorial_conflict.
              properties:
                expected_version: {type: integer}
                title: {type: string}
                note: {type: string}
                tags: {type: string}
                link: {type: string}
                spoiler: {type: boolean}
                media_order: {type: array, items: {type: integer}}
                removed: {type: array, items: {type: integer}}
                severity: {enum: [minor, substantive]}
      responses:
        '200': {description: EditorialRevision}
        '409': {description: editorial_conflict}
  /reviews/{review_id}/editorial-revisions/{revision_id}/finalize:
    post:
      summary: draft → finalized (only finalized may publish)
      operationId: finalizeEditorialRevision
      parameters:
        - {name: review_id, in: path, required: true, schema: {type: integer}}
        - {name: revision_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version]
              properties: {expected_version: {type: integer}}
      responses:
        '200': {description: EditorialRevision}
        '409': {description: editorial_conflict | editorial_state}
  /reviews/{review_id}/editorial-revisions/{revision_id}/preview:
    post:
      summary: Server-side caption preview of the edited version (side-effect free)
      operationId: previewEditorialRevision
      parameters:
        - {name: review_id, in: path, required: true, schema: {type: integer}}
        - {name: revision_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Optional unsaved field overrides for live preview
      responses:
        '200': {description: "{caption, parse_mode}"}
  /me/submissions/{review_id}/editorial-history:
    get:
      summary: Owner-scoped published editorial history (submitter-safe)
      operationId: editorialHistory
      parameters:
        - {name: review_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {description: SubmitterEditorialHistory}
        '404': {description: review_not_found (owner scoping hides existence)}

  /reviews/{review_id}/approve:
    post:
      summary: Claim and publish a review (destructive; human confirmation required)
      operationId: approveReview
      parameters:
        - {name: review_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                spoiler: {type: ['boolean', 'null']}
      responses:
        '200': {description: Published or already published}
        '401': {description: Invalid token}
        '403': {description: Read-only mode}
        '409': {$ref: '#/components/responses/reviewState'}
        '502': {description: Publish failed; review is retryable}
  /reviews/{review_id}/reject:
    post:
      summary: Reject a review (destructive; human confirmation required)
      operationId: rejectReview
      parameters:
        - {name: review_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: string, maxLength: 300}
      responses:
        '200': {description: Rejected}
        '401': {description: Invalid token}
        '403': {description: Read-only mode}
        '409': {$ref: '#/components/responses/reviewState'}
  /reviews/{review_id}/spoiler:
    patch:
      summary: Set spoiler before approval
      operationId: setReviewSpoiler
      parameters:
        - {name: review_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spoiler]
              properties:
                spoiler: {type: boolean}
      responses:
        '200': {description: Spoiler updated}
        '401': {description: Invalid token}
        '403': {description: Read-only mode}
        '409': {$ref: '#/components/responses/reviewState'}
  /notifications:
    post:
      summary: Send a text notification into the configured review chat
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NotificationRequest'}
      responses:
        '201':
          description: Notification accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  data:
                    type: object
                    properties:
                      status: {type: string, const: sent}
                      message_id: {type: integer}
        '200':
          description: Duplicate idempotency key
        '400': {$ref: '#/components/responses/unauthorized'}
        '409':
          description: Review chat not configured
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '502':
          description: Telegram delivery failed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}

  # ---- Telegram Mini App (§41-§42, §84) ----------------------------------
  /miniapp/session:
    post:
      summary: Validate Telegram initData and mint a short-lived Mini App session
      description: |
        The Mini App sends raw `initData` from the Telegram SDK launch context
        (`retrieveRawInitData()`), with the WebApp bridge as a compatibility fallback.
        The server verifies the Telegram signature (against the bot token),
        derives roles, and returns a short-lived `ma_v1.*` bearer session.
        Never send bot tokens or long-lived API tokens to the browser; this is
        the only Mini App auth path (§9-§12, §84).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [initData]
              properties:
                initData: {type: string, description: Raw Telegram WebApp initData}
      responses:
        '200':
          description: Session minted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean, const: true}
                  data:
                    type: object
                    required: [token, expires_in, user]
                    properties:
                      token: {type: string, description: 'Bearer session (ma_v1.*)'}
                      expires_in: {type: integer}
                      user:
                        type: object
                        properties:
                          telegram_user_id: {type: integer}
                          username: {type: string}
                          roles:
                            type: array
                            items: {type: string, enum: [submitter, reviewer, admin]}
        '401':
          description: initData missing/tampered/expired
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
          description: Mini App disabled (MINIAPP_ENABLED=false)
  /me/submissions:
    get:
      summary: The caller's own submission history (strictly user-scoped, §24-§25, §identity)
      description: |
        Returns ONLY reviews with explicit verified human attribution
        (submitter_user_id == the current Telegram user). Rows created by a
        service/API token bound to this user (PixivFlow automatic submissions,
        refetch replacements of service chains) are NEVER returned, even though
        the API token belongs to this user. The query keys on the submitter,
        not the request actor.
      parameters:
        - {name: cursor, in: query, required: false, schema: {type: string}}
        - {name: limit, in: query, required: false, schema: {type: integer, maximum: 100}}
      responses:
        '200':
          description: Own submissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            submission_id: {type: string}
                            review_chain_id: {type: string}
                            current_review_id: {type: integer}
                            status: {type: string, description: User-facing status (preparing|in_review|publishing|published|rejected|failed|expired); database states are mapped server-side}
                            title: {type: string}
                            tags: {type: array, items: {type: string}}
                            media_count: {type: integer}
                            document_count: {type: integer}
                            spoiler: {type: boolean}
                            created_at: {type: number, description: Logical submission start (chain origin)}
                            updated_at: {type: number}
                            generation: {type: integer}
                            refetch_count: {type: integer, description: Successful refetch replacements (chain length - 1)}
                      next_cursor: {type: [string, 'null']}
        '401': {$ref: '#/components/responses/unauthorized'}
  /me/submissions/{review_id}:
    get:
      summary: User-safe detail of one of the caller's logical submissions
      description: |
        Owner-scoped: only the verified human submitter of that review chain
        (or a reviewer via the review API) may read it. Internal lineage,
        refetch/slot ids, actor fields and audit data are never returned.
      parameters:
        - {name: review_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: Owner-safe submission detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  submission_id: {type: string}
                  review_chain_id: {type: string}
                  current_review_id: {type: integer}
                  status: {type: string}
                  title: {type: string}
                  note: {type: string}
                  link: {type: string}
                  tags: {type: array, items: {type: string}}
                  media_count: {type: integer}
                  document_count: {type: integer}
                  spoiler: {type: boolean}
                  created_at: {type: number}
                  updated_at: {type: number}
                  generation: {type: integer}
                  refetch_count: {type: integer}
        '401': {$ref: '#/components/responses/unauthorized'}
        '404': {description: Not found or not owned by the caller}
  /schedule/outcomes:
    post:
      summary: PixivFlow reports a TERMINAL schedule occurrence verdict
      description: |
        Called by the execution side for EVERY terminal occurrence
        (success/partial/failed). Durable and idempotent per slot_id: a
        duplicate clock trigger or an outbox replay never sends a second
        Telegram summary. The terminal text goes to the configured review/admin
        group and never contains mention-capable entities.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [schedule_id, slot_id, status]
              properties:
                schedule_id: {type: string}
                slot_id: {type: string}
                occurrence_at: {type: string}
                status: {type: string, enum: [success, partial, failed]}
                duration_ms: {type: integer}
                cells: {type: object}
                # Present when this terminal outcome belongs to a MANUAL
                # RECOVERY run: policy preset + request id. The receiver then
                # renders "已恢复/恢复失败" instead of the daily summary.
                recovery:
                  type: object
                  properties:
                    mode: {type: string, enum: [normal, relaxed]}
                    requestId: {type: string}
                targets:
                  type: array
                  items:
                    type: object
                    properties:
                      target_id: {type: string}
                      work_type: {type: string}
                      status: {type: string}
                      work_id: {type: [string, 'null']}
                      error_code: {type: string}
                      # Normalized first-level terminal failure reason
                      # (§failure-observability): stable code + business message.
                      # The review-group text shows the message, never raw error.
                      terminal_reason_code: {type: [string, 'null']}
                      reason: {type: [string, 'null']}
                      error: {type: [string, 'null']}
      responses:
        '200': {description: Notified (or replayed idempotently)}
        '400': {description: Validation error}
        '401': {$ref: '#/components/responses/unauthorized'}
  /admin/status:
    get:
      summary: Operational status snapshot (admin-only)
      description: |
        Requires a verified user session with the admin role. Returns queue
        counts, active refetch attempts, recent failures, blacklist size,
        current policy and runtime version. Never contains credentials.
      responses:
        '200': {description: Snapshot}
        '401': {$ref: '#/components/responses/unauthorized'}
        '403': {description: Requires admin role}
  /admin/policy:
    get:
      summary: Read effective runtime policy (admin-only)
      responses:
        '200': {description: Toggle values + overrides}
        '403': {description: Requires admin role}
    patch:
      summary: Toggle api_review / chat_review / show_submitter (admin-only, audited)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                api_review: {type: string, enum: [on, off]}
                chat_review: {type: string, enum: [on, off]}
                show_submitter: {type: string, enum: [on, off]}
      responses:
        '200': {description: Applied (+ reload_scheduled)}
        '409': {description: Review chat not configured / queue not empty}
        '403': {description: Requires admin role}
  /admin/blacklist:
    get:
      summary: List blacklist entries (admin-only)
      responses:
        '200': {description: Entries}
        '403': {description: Requires admin role}
    post:
      summary: Add a blacklist entry (admin-only, audited, idempotent)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: {type: integer}
                reason: {type: string}
      responses:
        '201': {description: Added}
        '403': {description: Requires admin role}
  /admin/blacklist/{user_id}:
    delete:
      summary: Remove a blacklist entry (admin-only, audited)
      parameters:
        - {name: user_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {description: Removed}
        '403': {description: Requires admin role}
  /reviews/{review_id}/refetch:
    post:
      summary: Request a remote candidate replacement ("重抓") for a pending review
      description: |
        Same application command as the Bot button — the Mini App never gets a
        second implementation (§39). Reviewer RBAC is enforced server-side.
        Answers 202 once the attempt is durable; the remote PixivFlow worker
        reports the terminal verdict asynchronously (GET this endpoint).
      parameters:
        - {name: review_id, in: path, required: true, schema: {type: integer}}
      responses:
        '202':
          description: Attempt admitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  data:
                    type: object
                    properties:
                      state: {type: string, enum: [requested, admitted]}
                      request_id: {type: string}
                      replayed: {type: boolean}
                      already_running: {type: boolean}
                      review_chain_id: {type: string}
                      generation: {type: integer}
                      target_id: {type: string}
        '401': {$ref: '#/components/responses/unauthorized'}
        '403': {description: Requires reviewer role}
        '404': {description: Review not found}
        '409': {description: Review not pending / one active attempt}
        '503': {description: PixivFlow refetch not configured}
    get:
      summary: Read-only refetch attempt + candidate lineage for a review (§35-§36)
      parameters:
        - {name: review_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: Attempt + lineage
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  data:
                    type: object
                    properties:
                      review_id: {type: integer}
                      review_chain_id: {type: string}
                      generation: {type: integer}
                      supersedes_review_id: {type: [integer, 'null']}
                      attempt:
                        type: [object, 'null']
                        properties:
                          request_id: {type: string}
                          state: {type: string, enum: [requested, admitted, replaced, no_alternative, failed, obsolete]}
                          generation: {type: integer}
                          source_review_id: {type: integer}
                          result_candidate_id: {type: string}
                          failure_code: {type: string}
                          scanned: {type: integer}
                      lineage:
                        type: array
                        items:
                          type: object
                          properties:
                            generation: {type: integer}
                            candidate_id: {type: string}
                            source: {type: string}
        '401': {$ref: '#/components/responses/unauthorized'}
        '403': {description: Requires reviewer role}
        '404': {description: Review not found}
  /refetch/outcomes:
    post:
      summary: PixivFlow reports a terminal refetch verdict (no_alternative|failed)
      description: |
        Internal service endpoint; authenticated with the same per-bot submit
        token PixivFlow already holds. Idempotent per attempt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_id, disposition]
              properties:
                request_id: {type: string}
                disposition: {type: string, enum: [no_alternative, failed]}
                reason: {type: string}
                scanned: {type: integer}
                skipped: {type: object}
      responses:
        '200': {description: Accepted / idempotent replay / obsolete}
        '401': {$ref: '#/components/responses/unauthorized'}
        '404': {description: Unknown attempt}
