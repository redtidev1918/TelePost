services:
  telepost:
    image: ghcr.io/redtidev1918/telepost:latest   # 预构建镜像；本地有源码时改 build: .
    container_name: telepost
    restart: unless-stopped

    # 在同目录建 .env：写 TOKEN=xxx、CHANNEL_ID=@xxx、OWNER_ID=xxx（compose 自动读取）
    # 或改用配置文件挂载：- ./config.ini:/app/config.ini:ro
    environment:
      - TZ=Asia/Shanghai
      - TOKEN=${TOKEN}
      - CHANNEL_ID=${CHANNEL_ID}
      - OWNER_ID=${OWNER_ID}
      # 可选开关：SHOW_SUBMITTER=true / BOT_MODE=MIXED / SEARCH_INDEX_DIR=data/search_index

    volumes:
      - ./data:/app/data      # 数据库 + 搜索索引（必须持久化）
      - ./logs:/app/logs

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

    deploy:
      resources:
        limits:
          memory: 1G
