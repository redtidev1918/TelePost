services:
  telepost:
    # 固定你要部署的 release version（形如 2.x.y）。示例：
    #   TELEPOST_VERSION=2.x.y docker compose pull && docker compose up -d
    # 不设置时会落到 latest —— latest 会随时间漂移，只适合本机试用，生产不要用。
    # 本地有源码时把 image 换成 build: .
    image: ghcr.io/redtidev1918/telepost:${TELEPOST_VERSION:-latest}
    container_name: telepost
    restart: unless-stopped

    # 在同目录建 .env：写 TOKEN=xxx、CHANNEL_ID=@xxx、OWNER_ID=xxx（compose 自动读取）
    # 或改用配置文件挂载：- ./config.ini:/app/config.ini:ro
    environment:
      - TZ=Asia/Shanghai
      - TOKEN=${TOKEN:-}
      - CHANNEL_ID=${CHANNEL_ID:-}
      - OWNER_ID=${OWNER_ID:-}
      - BOT_LANGUAGE=${BOT_LANGUAGE:-zh}
      - REVIEW_CHAT_ID=${REVIEW_CHAT_ID:-}
      - BOT1_TOKEN=${BOT1_TOKEN:-}
      - BOT1_CHANNEL_ID=${BOT1_CHANNEL_ID:-}
      - BOT1_OWNER_ID=${BOT1_OWNER_ID:-}
      - BOT1_REVIEW_CHAT_ID=${BOT1_REVIEW_CHAT_ID:-}
      - BOT1_LANGUAGE=${BOT1_LANGUAGE:-${BOT_LANGUAGE:-zh}}
      - BOT2_TOKEN=${BOT2_TOKEN:-}
      - BOT2_CHANNEL_ID=${BOT2_CHANNEL_ID:-}
      - BOT2_OWNER_ID=${BOT2_OWNER_ID:-}
      - BOT2_REVIEW_CHAT_ID=${BOT2_REVIEW_CHAT_ID:-}
      - BOT2_LANGUAGE=${BOT2_LANGUAGE:-${BOT_LANGUAGE:-zh}}
      # 可选开关：SHOW_SUBMITTER=true / BOT_MODE=MIXED / SEARCH_INDEX_DIR=data/search_index

    volumes:
      - ./data:/app/data      # 数据库 + 搜索索引（必须持久化）
      - ./logs:/app/logs

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

    # 容器内部健康检查（不依赖宿主机端口映射）。镜像里已有一条等价的
    # HEALTHCHECK；这里显式声明，保证本地 `docker build` 的镜像在
    # `docker compose ps` 里也能看到健康状态。用 python 而不是 curl —— 运行镜像
    # 只保证装有 Python 标准库，没有 curl。
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

    deploy:
      resources:
        limits:
          memory: 1G
