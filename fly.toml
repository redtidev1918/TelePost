# Fly.io 应用配置文件
# TelePost - Telegram 投稿机器人

# 应用名称（留空将在 fly launch 时自动生成或提示输入）
app = ""

# 主区域（可在 fly launch 时选择）
primary_region = ""

# 构建配置
[build]
  dockerfile = "Dockerfile"

# 环境变量（非敏感信息）
[env]
  # 运行模式：必须设置为 WEBHOOK
  RUN_MODE = "WEBHOOK"
  
  # Webhook 配置
  WEBHOOK_PORT = "8080"
  WEBHOOK_PATH = "/webhook"
  
  # 搜索引擎优化（使用轻量级分词器节省内存）
  SEARCH_ANALYZER = "simple"
  
  # 数据库缓存优化（KB）
  DB_CACHE_KB = "1024"
  
  # 时区
  TZ = "Asia/Shanghai"

# HTTP 服务配置
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  
  [[http_service.checks]]
    grace_period = "60s"
    interval = "60s"
    method = "GET"
    timeout = "30s"
    path = "/health"

# 虚拟机配置
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

# 数据库、运行时策略与会话状态必须放在持久卷。
[[mounts]]
  source = "telepost_data"
  destination = "/app/data"

# 注意：
# 1. 敏感信息（TOKEN, CHANNEL_ID, OWNER_ID, WEBHOOK_URL）应使用 flyctl secrets set 设置
# 2. 首次部署使用: flyctl launch
# 3. 设置密钥: flyctl secrets set TOKEN=xxx CHANNEL_ID=@xxx OWNER_ID=xxx WEBHOOK_URL=https://xxx.fly.dev
#    （代码兼容 BOT_TOKEN / TELEGRAM_BOT_TOKEN 作为别名）
# 4. 后续部署使用: flyctl deploy
