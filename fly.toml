# Fly.io 应用配置 —— TelePost 常驻投稿 / 审核 / 发布服务
#
# 这是本仓库唯一的部署拓扑文件。
#
# 历史上这里有两个互相重叠的拓扑：本文件（256MB + auto-stop 模板）与
# `deploy.fly-multi-bot.toml`（512MB、常驻，但在同一个容器里通过
# `PIXIVFLOW_ENABLED=true` 再拉起一个 PixivFlow 调度器）。后者才是线上实际使用的
# 配置，也是所有混部问题的来源：TelePost 与 PixivFlow 共用 512MB 内存、共用进程
# 生命周期、共用机器生命周期、共用故障域、共用启动/关闭时序，后者又是 stateful
# durable worker（SQLite 槽位账本 + 投递队列 + token + 限速状态），两者的部署与
# 伸缩诉求互相冲突。`deploy.fly-multi-bot.toml` 已删除；PixivFlow 现在是独立 App
# （见 pixivflow-telepost-deploy 仓库）。
#
# 本服务必须常驻：
#   * Telegram 投稿要求即时响应，auto-stop 的冷启动唤醒延迟不可接受（历史上多次
#     因此出现「机器人不回复」）。
#   * 成本不靠让投稿后端频繁休眠来省 —— 那会反复制造生命周期问题，省下的钱不值
#     得牺牲可靠性。成本由 PixivFlow 侧「平时 stopped、按需唤醒」来省。
#
# 本文件使用占位符：仓库是公开的，生产 app 名 / 域名 / 密钥一律不进版本库，
# 由部署时以 `fly deploy` 参数或 `pixivflow-telepost-deploy` 的部署脚本注入。
#
# 部署：
#   fly apps create <your-telepost-app>
#   fly volumes create data --size 1 -r iad
#   fly secrets set -a <your-telepost-app> \
#       BOT1_TOKEN=... BOT1_CHANNEL_ID=... BOT1_OWNER_ID=... \
#       BOT2_TOKEN=... BOT2_CHANNEL_ID=... BOT2_OWNER_ID=... \
#       WEBHOOK_URL=https://<your-telepost-app>.fly.dev
#   fly deploy -c fly.toml

app = ""
primary_region = ""

[build]
  dockerfile = "Dockerfile"

[env]
  PYTHONUNBUFFERED = "1"
  PYTHONDONTWRITEBYTECODE = "1"

  # 只有 webhook 模式能保证多 bot 同机 + 即时响应。
  RUN_MODE = "WEBHOOK"

  # run.py 的路由进程占 WEBHOOK_PORT（对外 + Fly 健康检查），
  # botN 子进程占 WEBHOOK_PORT+N（仅回环），路径为 /webhook/botN。
  WEBHOOK_PORT = "8080"
  WEBHOOK_PATH = "/webhook"

  # 轻量分词器：多 bot 同机时优先省内存。
  SEARCH_ANALYZER = "simple"

  # SQLite 页缓存（KB）。
  DB_CACHE_KB = "1024"

  TZ = "Asia/Shanghai"

[http_service]
  internal_port = 8080
  force_https = true

  # 常驻，不使用平台侧空闲推断停机。
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  # 常驻服务保留长期健康检查：它只确认进程还能接活，不会与停机互相拉扯
  # （本服务本来就不应该停）。
  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  # 512MB 是当前生产实测规格。降到 256MB 前必须先做真实内存验收：bot1 + bot2
  # 同时运行、/start、会话投稿、多图上传、GIF/document、审核、批准、发布、
  # HTTP 投稿、search/admin 基本路径，记录 idle RSS / 常规峰值 RSS /
  # 审核发布峰值 RSS；只有确认稳定且余量充足才降。稳定优先于每月省一两美元。
  memory_mb = 512

# 数据库、运行时策略与会话状态必须放在持久卷上。
[[mounts]]
  source = "data"
  destination = "/app/data"
